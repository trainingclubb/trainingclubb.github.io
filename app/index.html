<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070807">
<meta name="description" content="Training Club: tu rutina, tus cuotas y tus asistencias. Una marca de AdForge.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Training Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: marca Training Club (negro + degradé amarillo→turquesa del logo), una sola apariencia oscura a propósito.
   Barra superior con selector Socio/Dueño; socio = teléfono centrado; dueño = panel ancho */
:root{
  --bg:#070807; --surface:#121412; --sunk:#0C0E0C; --ink:#F3F5F0; --muted:#98A099; --line:#232723;
  --yellow:#FCE024; --lime:#DDDC34; --teal:#24C9A7;
  --grad:linear-gradient(120deg,var(--yellow) 0%,var(--lime) 40%,var(--teal) 100%);
  --accent:#24C9A7; --accent-soft:#0F2B25; --on-accent:#05110E;
  --ok:#24C9A7; --ok-bg:#0F2B25; --bad:#FF5D4E; --bad-bg:#361411; --warn:#FCE024; --warn-bg:#2E2A0A; --future:#1B1E1B;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --wide:Archivo, Inter, system-ui, sans-serif;
  --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{max-width:1000px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:52px;height:auto;flex:none}
.wordmark{display:flex;flex-direction:column;align-items:center;line-height:1}
.wordmark b{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.01em;text-transform:uppercase;transform:skewX(-12deg);display:block}
.wordmark span{font-family:var(--wide);font-weight:800;font-size:11px;letter-spacing:.55em;margin-right:-.55em;padding-top:3px}
.by{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.note{max-width:1000px;margin:0 auto 14px;color:var(--muted);font-size:13px;text-align:center}

/* Teléfono */
.phone{max-width:390px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:34px;overflow:hidden;
  box-shadow:0 30px 70px -30px rgba(36,201,167,.28);display:flex;flex-direction:column;min-height:720px;position:relative}
.phone::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--grad)}
.btn{background:var(--grad)!important;color:var(--on-accent)!important}
.btn.ghost{background:var(--sunk)!important;color:var(--ink)!important}
.prog i,.bars div,.cal .d.went{background:var(--grad)!important}
.cal .d.went{color:var(--on-accent)}
.avatar{background:var(--grad)!important;color:var(--on-accent)!important}
.hi .mk{width:26px;height:auto;margin-bottom:6px;display:block}
/* v3: interfaz pulida + perfil con foto */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:13px;font-weight:700}
.sicons{display:flex;gap:3px;align-items:flex-end}
.sicons i{width:3px;background:var(--ink);border-radius:1px}.sicons i:nth-child(1){height:5px}.sicons i:nth-child(2){height:8px}.sicons i:nth-child(3){height:11px}
.sicons b{width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;margin-left:5px;background:linear-gradient(90deg,var(--ink) 70%,transparent 70%);background-clip:content-box;padding:1px}
.screen{padding-top:14px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.screen.enter{animation:fadein .25s ease}
.screen>*{flex-shrink:0}
.phone{height:min(820px,calc(100dvh - 150px));min-height:640px}
@media (max-width:440px){.phone{height:calc(100dvh - 130px);min-height:560px}}
.apphead{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;border-bottom:1px solid var(--line);flex:none}
.apphead img{width:34px;height:auto}
.wm{display:flex;flex-direction:column;align-items:center;line-height:1}
.wm b{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;transform:skewX(-12deg);display:block}
.wm span{font-family:var(--wide);font-weight:800;font-size:8px;letter-spacing:.55em;margin-right:-.55em;padding-top:2px}
.hpill{margin-left:auto;border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;background:var(--grad);color:var(--on-accent)}
.sbar{flex:none}
/* cronómetro */
.timer{position:sticky;top:-22px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 24px -14px rgba(0,0,0,.8)}
.timer::before{content:"";position:absolute;inset:0 0 auto;height:3px;border-radius:22px 22px 0 0;background:var(--grad)}
.tmodes{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.tmodes button{border:0;background:none;border-radius:10px;padding:7px;font-size:13px;font-weight:700;color:var(--muted)}
.tmodes button[aria-pressed="true"]{background:var(--future);color:var(--ink)}
.tbig{font-family:var(--display);font-weight:900;font-size:58px;line-height:1;text-align:center;letter-spacing:.02em}
.tbtns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.tb{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:11px 6px;font-weight:700;font-size:14px}
.tb.main{background:var(--grad);color:var(--on-accent);border:0}
.tb:disabled{opacity:.4;cursor:default}
.laps{list-style:none;margin:0;padding:0;max-height:76px;overflow-y:auto;font-size:13px}
.laps li{display:flex;justify-content:space-between;padding:4px 2px;border-top:1px solid var(--line);color:var(--muted)}
.rbar{height:6px;border-radius:99px;background:var(--future);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--grad)}
.presets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.presets button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
/* rutina */
.rhead{display:flex;justify-content:space-between;align-items:flex-end}
.h2sub2{margin:4px 0 0;color:var(--muted);font-size:13px}
.rcount{font-family:var(--display);font-weight:900;font-size:30px;color:var(--teal)}
.ex{display:grid!important;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px!important}
.anim{width:76px;height:76px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#1a1f1b,#0b0d0b);border:1px solid var(--line);overflow:hidden}
.anim svg{width:100%;height:100%;display:block}
.anim .bone{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;fill:none}
.anim .bone.dim{opacity:.45}
.anim .rib{stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;opacity:.8}
.anim .skull{fill:var(--sunk);stroke:var(--ink);stroke-width:2.2}
.anim .eye{fill:var(--ink)}
.anim .joint{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.anim .pelvis{fill:none;stroke:var(--ink);stroke-width:1.8}
.anim .floor{stroke:var(--line);stroke-width:1.5}
.anim .gear{stroke:var(--teal);stroke-linecap:round;fill:none}
.anim .gearf{fill:var(--teal)}
.anim .gear-s{stroke:#3a403b;stroke-linecap:round;fill:none}
.anim .plate{fill:none;stroke:var(--yellow);stroke-width:2.6}
.anim .cable{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.exinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.exinfo .meta b{color:var(--ink)}
.restbtn{align-self:flex-start;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--teal);margin-top:2px}
.exlist .ex .chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:none;color:transparent;font-weight:900;display:grid;place-items:center}
.exlist .ex.done .chk{background:var(--grad);border-color:transparent;color:var(--on-accent)}
@keyframes fadein{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{margin:0 0 4px!important;font-size:12px!important;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hi h1{font-size:34px}
.avatar{border:0;padding:0;overflow:hidden;font-size:15px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.xl{width:124px;height:124px;font-size:42px;font-family:var(--display);font-weight:800;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--teal)}
.avatar.sm{width:30px;height:30px;font-size:11px;flex:none}
.avbtn{position:relative;border:0;background:none;padding:0;border-radius:50%}
.avbtn .avatar{width:48px;height:48px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--teal)}
.avbtn .cam{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center;border:2px solid var(--surface)}
.status{gap:8px;padding:18px;border:1px solid transparent}
.status.ok{border-color:rgba(36,201,167,.25)} .status.bad{border-color:rgba(255,93,78,.3)}
.status .pill{background:var(--surface)}
.strow{display:flex;justify-content:space-between;align-items:center}
.status .big{font-size:40px}
.card{background:var(--sunk);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .ttl b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.card .ttl span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;color:var(--muted);font-weight:700}
.week i{width:32px;height:32px;border-radius:50%;background:var(--future);display:grid;place-items:center;font-style:normal;color:var(--muted);font-size:12px;font-weight:700}
.week i.on{background:var(--grad);color:var(--on-accent)}
.week i.today{box-shadow:0 0 0 2px var(--sunk),0 0 0 4px var(--ink)}
.done-msg{margin:0;font-size:13px;color:var(--teal);font-weight:600}
.mini-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.mini-ex:last-child{border-bottom:0} .mini-ex span:last-child{color:var(--muted);white-space:nowrap}
.link{border:0;background:none;color:var(--teal);font-weight:700;padding:0;text-align:left;font-size:14px}
.of{font-size:18px;color:var(--muted)}
.tile{border-radius:18px}
.ex{transition:border-color .15s} .ex:hover{border-color:var(--teal)}
.ex.done{border-color:rgba(36,201,167,.35);background:var(--ok-bg)}
.nav button{transition:background .15s,color .15s}
.pfhead{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:20px;line-height:1}
.pf{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.pf-actions{display:flex;gap:8px;width:100%}
.pf-actions .btn{flex:1;text-align:center;display:block}
.pf-actions .btn.ghost{flex:0 0 auto;width:auto}
label.btn{cursor:pointer}
.hint{margin:0;font-size:13px;color:var(--muted);max-width:30ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:14px}
.list div:last-child{border-bottom:0} .list div span:first-child{color:var(--muted)}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{background:var(--future)!important;color:var(--ink)!important}
.who .avatar:has(img){background:none!important}
.foot{max-width:1000px;margin:22px auto 0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.screen{flex:1;padding:22px 18px 18px;display:flex;flex-direction:column;gap:16px}
.hi{display:flex;justify-content:space-between;align-items:center}
.hi h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1;text-transform:uppercase}
.hi p{margin:2px 0 0;color:var(--muted);font-size:13px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.status{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.status.ok{background:var(--ok-bg)} .status.bad{background:var(--bad-bg)}
.status .lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.status.ok .lab{color:var(--ok)} .status.bad .lab{color:var(--bad)}
.status .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.status .sub{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--on-accent);width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sunk);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1}
h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;text-transform:uppercase;line-height:1}
.h2sub{color:var(--muted);font-size:13px;margin-top:-10px}

.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 10px}
.nav button{border:0;background:none;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Rutina */
.days{display:flex;gap:8px;overflow-x:auto}
.days button{flex:none;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;text-align:left}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.days small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.prog{height:8px;border-radius:99px;background:var(--future);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ex{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%}
.ex .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.ex.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ex.done .nm{text-decoration:line-through;color:var(--muted)}
.ex .nm{font-weight:600} .ex .meta{font-size:13px;color:var(--muted)}
.ex .load{margin-left:auto;font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.exlist{display:flex;flex-direction:column;gap:8px}

/* Cuotas */
.yearhead{display:flex;justify-content:space-between;align-items:baseline}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{border:0;border-radius:14px;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.m b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.m span{font-size:11px;font-weight:600}
.m.paid{background:var(--ok-bg)} .m.paid span{color:var(--ok)}
.m.owed{background:var(--bad-bg)} .m.owed span{color:var(--bad)}
.m.future{background:var(--future)} .m.future span{color:var(--muted)}
.m[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.detail{background:var(--sunk);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.detail div{display:flex;justify-content:space-between;gap:10px} .detail div span:first-child{color:var(--muted)}

/* Asistencias */
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;width:36px;height:36px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--sunk);max-width:100%}
.cal .d.went{background:var(--accent);color:var(--on-accent)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.fut{color:var(--muted);opacity:.5}
.cal .e{visibility:hidden}

/* Dueño */
.owner{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panelhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.mini{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.mini.pay{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--future)}
.dots i.p{background:var(--ok)} .dots i.o{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--accent);border-radius:6px 6px 0 0;min-width:0;position:relative}
.bars div.wk{opacity:.45}
.barlabels{display:flex;gap:6px;font-size:11px;color:var(--muted)} .barlabels span{flex:1;text-align:center}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.duelist{display:flex;flex-direction:column;gap:8px}
.duelist div{display:flex;justify-content:space-between;font-size:14px;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:440px){.phone{border-radius:24px;min-height:0}}
</style>

.phone{max-width:none!important;height:100dvh!important;min-height:0!important;border-radius:0!important;border:0!important;box-shadow:none!important}
.phone .sbar{display:none!important}.phone::before{display:none}}
</style>

function estadoSocio(s){
  if(s.i===0) return paidNow()?{c:'ok',t:'Al día',v:'10/12'}:{c:'bad',t:'Vencida',v:'10/11'};
  const [d,m]=s.v.split('/').map(Number); const due=new Date(m<11?2027:2026,m-1,d);
  const days=Math.round((due-TODAY)/864e5);
  if(s.paidNow) return {c:'ok',t:'Al día',v:s.v2};
  if(days<0) return {c:'bad',t:'Vencida',v:s.v,days};
  if(days<=7) return {c:'warn',t:'Por vencer',v:s.v,days};
  return {c:'ok',t:'Al día',v:s.v,days};
}

function screenInicio(){
  const ok=paidNow(); const att=attMonth(2026,10); const visitas=att.length; const r=RUTINA[S.day];

function loadPhoto(file){
  if(!file.type.startsWith('image/')) return toast('Ese archivo no es una imagen');
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=320;const s=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,320,320);
    S.photo=c.toDataURL('image/jpeg',.86);savePerfil();render();toast('Foto actualizada')};
    img.onerror=()=>toast('No se pudo abrir esa imagen');img.src=r.result};
  r.readAsDataURL(file);
}
function savePerfil(){try{localStorage.setItem('tc-perfil',JSON.stringify({photo:S.photo,name:S.name}))}catch(e){}}

function timerCard(){
  const c=S.tmode==='crono';
  const sw=`<div class="tbig num" id="swtime">${fmtSW(swNow())}</div>
    <div class="tbtns"><button class="tb main" id="swgo">${S.sw.run?'Pausar':(swNow()?'Seguir':'Iniciar')}</button>
    <button class="tb" id="swlap" ${S.sw.run?'':'disabled'}>Vuelta</button><button class="tb" id="swreset" ${swNow()?'':'disabled'}>Reiniciar</button></div>
    ${S.sw.laps.length?`<ol class="laps num">${S.sw.laps.map((l,i)=>`<li><span>Vuelta ${i+1}</span><span>${fmtSW(l)}</span></li>`).reverse().join('')}</ol>`:''}`;
  const r=restNow();
  const rs=`<div class="tbig num" id="resttime">${fmtR(r)}</div>
    <div class="rbar"><i id="restbar" style="width:${r/S.rest.total*100}%"></i></div>
    <div class="presets" role="group" aria-label="Tiempo de descanso">${[30,60,90,120,180].map(s=>`<button data-preset="${s}" aria-pressed="${S.rest.total===s*1000}">${s<60?s+' s':s%60?'1:30':s/60+' min'}</button>`).join('')}</div>
    <div class="tbtns"><button class="tb main" id="restgo">${S.rest.run?'Pausar':(r<S.rest.total&&r>0?'Seguir':'Iniciar')}</button>
    <button class="tb" id="restplus">+15 s</button><button class="tb" id="restreset">Reiniciar</button></div>`;
  return `<section class="timer">
    <div class="tmodes" role="group" aria-label="Modo"><button data-tmode="crono" aria-pressed="${c}">Cronómetro</button><button data-tmode="rest" aria-pressed="${!c}">Descanso</button></div>
    ${c?sw:rs}</section>`;
}

const ln=(a,b,c='bone',w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="${c}"${w?` stroke-width="${w}"`:''}/>`;
const ci=(p,r,c)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" class="${c}"/>`;
function drawSkel(a,t){
  const P={}; for(const k in a.A){const A=a.A[k],B=a.B[k]||A;P[k]=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t]}
  let g=ln([4,94],[96,94],'floor');
  for(const q of a.eq){
    if(q[0]==='bench') g+=ln([q[1],q[3]],[q[2],q[3]],'gear-s',5)+ln([q[1]+3,q[3]],[q[1]+3,94],'gear-s',2.5)+ln([q[2]-3,q[3]],[q[2]-3,94],'gear-s',2.5);
    if(q[0]==='seat') g+=`<polyline points="${q[1].map(p=>p.join(',')).join(' ')}" class="gear-s" stroke-width="5"/>`;
    if(q[0]==='hbar') g+=ln([q[1],q[3]],[q[2],q[3]],'gear',3.5);
    if(q[0]==='cable') g+=ci([q[1],q[2]+3],3,'gear')+ln([q[1],q[2]+3],P.w,'cable');
  }
  if(P.k2) g+=ln(P.p,P.k2,'bone dim')+ln(P.k2,P.f2,'bone dim');
  // columna y costillas
  g+=ln(P.n,P.p);
  const dx=P.p[0]-P.n[0],dy=P.p[1]-P.n[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  for(const f of [.16,.3,.44]){const c=[P.n[0]+dx*f,P.n[1]+dy*f];const w=4.2-f*3;g+=ln([c[0]-uy*w,c[1]+ux*w],[c[0]+uy*w,c[1]-ux*w],'rib')}
  g+=ci(P.p,3,'pelvis');
  g+=ln(P.p,P.k)+ln(P.k,P.f); if(P.t) g+=ln(P.f,P.t);
  g+=ln(P.n,P.s)+ln(P.s,P.e)+ln(P.e,P.w);
  for(const j of ['e','k','w','f']) g+=ci(P[j],1.7,'joint');
  g+=ci(P.h,5.6,'skull')+ci([P.h[0]+2,P.h[1]-.6],1.2,'eye')+ln([P.h[0]+1,P.h[1]+3.4],[P.h[0]+4,P.h[1]+3.4],'rib');
  for(const q of a.eq){
    if(q[0]==='plate') g+=ln([P.w[0]-1,P.w[1]],[P.w[0]+1,P.w[1]],'gear',3)+ci(P.w,7,'plate');
    if(q[0]==='db') g+=ln([P.w[0]-5,P.w[1]],[P.w[0]+5,P.w[1]],'gear',2)+ci([P.w[0]-5,P.w[1]],2.6,'gearf')+ci([P.w[0]+5,P.w[1]],2.6,'gearf');
    if(q[0]==='handle') g+=ln([P.w[0]-9,P.w[1]],[P.w[0]+9,P.w[1]],'gear',3);
    if(q[0]==='wheel') g+=ci([P.w[0],P.w[1]+4],5,'plate')+ci([P.w[0],P.w[1]+4],1.2,'gearf');
    if(q[0]==='sled'){const vx=P.f[0]-P.k[0],vy=P.f[1]-P.k[1],m=Math.hypot(vx,vy)||1;const px=-vy/m*10,py=vx/m*10;
      g+=ln([P.f[0]+px+vx/m*3,P.f[1]+py+vy/m*3],[P.f[0]-px+vx/m*3,P.f[1]-py+vy/m*3],'gear',5)}
  }
  return g;
}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animLoop(ts){
  document.querySelectorAll('.anim').forEach(el=>{const a=ANIM[el.dataset.anim]; if(!a) return;
    const dur=a.dur||1900; const ph=(ts%dur)/dur; const t=reduceMotion?1:(1-Math.cos(ph*2*Math.PI))/2;
    el.firstElementChild.innerHTML=drawSkel(a,t)});
  if(!reduceMotion) requestAnimationFrame(animLoop);
}

function screenAsist(){
  const y=S.calY,m=S.calM; const days=attMonth(y,m); const first=new Date(y,m,1); const n=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7; let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="d e"></span>';
  for(let d=1;d<=n;d++){const dt=new Date(y,m,d);const fut=dt>TODAY;const isT=dt.getTime()===TODAY.getTime();
    cells+=`<span class="d num ${days.includes(d)?'went':''} ${fut?'fut':''} ${isT?'today':''}">${d}</span>`}
  const prevOk=!(y===2026&&m===8), nextOk=!(y===2026&&m===10);
  const weeks=m===10?TODAY.getDate()/7:n/7;
  return `<h2>Asistencias</h2>
  <div class="row2"><div class="tile"><div class="k">${MES[m]}</div><div class="v num">${days.length} <span style="font-size:16px">visitas</span></div></div>

}

  if(b.id==='quitar'){S.photo=null;savePerfil();toast('Foto quitada');return render()}
  if(b.id==='checkin'){
    if(!paidNow()) return toast('Entrada bloqueada: la cuota está vencida');
    const a=S.att['2026-10']; if(a.includes(18)) return toast('Ya registraste tu entrada de hoy');
    a.push(18); toast('Entrada registrada. ¡Bienvenida a Training Club!'); return render();
  }
  if(b.dataset.day){S.day=+b.dataset.day;return render()}
  if(b.dataset.ex){S.done.has(b.dataset.ex)?S.done.delete(b.dataset.ex):S.done.add(b.dataset.ex);return render()}
  if(b.dataset.tmode){S.tmode=b.dataset.tmode;return render()}
  if(b.id==='swgo'){const s=S.sw; if(s.run){s.acc+=Date.now()-s.t0;s.run=false}else{s.t0=Date.now();s.run=true} return render()}
  if(b.id==='swlap'){S.sw.laps.push(swNow());return render()}
  if(b.id==='swreset'){S.sw={run:false,t0:0,acc:0,laps:[]};return render()}
  if(b.dataset.preset){const ms=+b.dataset.preset*1000;S.rest={run:false,end:0,left:ms,total:ms};return render()}
  if(b.id==='restgo'){const r=S.rest; if(r.run){r.left=restNow();r.run=false}else{if(r.left<=0)r.left=r.total;r.end=Date.now()+r.left;r.run=true} return render()}
  if(b.id==='restplus'){const r=S.rest; if(r.run) r.end+=15000; else r.left+=15000; r.total=Math.max(r.total,restNow()); return render()}
  if(b.id==='restreset'){S.rest.run=false;S.rest.left=S.rest.total;return render()}
  if(b.dataset.rest){const ms=+b.dataset.rest*1000;S.rest={run:true,end:Date.now()+ms,left:ms,total:ms};S.tmode='rest';
    S.forceTop=true;toast('Descanso de '+fmtR(ms)+' en marcha');return render()}
  if(b.id==='fin'){toast('Entrenamiento guardado');[...S.done].filter(k=>k.startsWith(S.day+'-')).forEach(k=>S.done.delete(k));return render()}
  if(b.dataset.m){S.selMonth=+b.dataset.m;return render()}
  if(b.id==='prevM'){S.calM--;return render()}
  if(b.id==='nextM'){S.calM++;return render()}
  if(b.dataset.f){S.filter=b.dataset.f;return render()}
  if(b.dataset.pay){const s=SOCIOS[+b.dataset.pay];
    if(s.i===0){S.paid[10]='18/11';S.medio[10]='Efectivo'} else {s.paidNow=true;s.v2='18/12'}
    toast('Pago registrado: '+s.n); return render();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='foto'&&e.target.files[0]) loadPhoto(e.target.files[0]);
  if(e.target.id==='nombre'){const v=e.target.value.trim(); if(v){S.name=v;savePerfil();toast('Nombre guardado')}}
});
S.view='socio';document.querySelector('.seg').hidden=true;document.querySelector('.note').hidden=true;
render();
if(reduceMotion) setInterval(()=>animLoop(0),500); else requestAnimationFrame(animLoop);
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
