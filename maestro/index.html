<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel general · Gimnasios</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070807">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Panel general: la lista de gimnasios de la plataforma y, al elegir uno, su panel o la app del socio en vivo */
:root{
  --bg:#070807; --surface:#121412; --sunk:#0C0E0C; --ink:#F3F5F0; --muted:#98A099; --line:#232723;
  --accent:#24C9A7; --accent-soft:#0F2B25; --on-accent:#05110E;
  --grad:linear-gradient(120deg,#FCE024 0%,#DDDC34 40%,#24C9A7 100%);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F4F5F1; --surface:#FFFFFF; --sunk:#ECEEE9; --ink:#131512; --muted:#5E665F; --line:#DADDD6;
  --accent:#13866F; --accent-soft:#DDF3EC; --on-accent:#FFFFFF; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F5F1; --surface:#FFFFFF; --sunk:#ECEEE9; --ink:#131512; --muted:#5E665F; --line:#DADDD6;
  --accent:#13866F; --accent-soft:#DDF3EC; --on-accent:#FFFFFF; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100dvh}
/* lista de gimnasios */
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 14px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{margin:2px 0 0;font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:13px}
.lbl{padding:14px 20px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.gyms{list-style:none;margin:0;padding:0 10px;overflow:auto;flex:1;display:grid;align-content:start;gap:4px}
.gym{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:14px;padding:10px}
.gym:hover{background:var(--sunk)}
.gym[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.gym img{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#0C0E0C;padding:6px}
.gym b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gym small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.next{margin:6px 10px 0;border:1.5px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted);font-size:13px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.next span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1.5px dashed var(--line);font-size:20px}
.foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* área del gimnasio elegido */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.bar .back{display:none}
.bar h2{margin:0;font-size:17px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.open{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;color:var(--ink);text-decoration:none}
.open svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;min-height:0;position:relative;background:var(--bg)}
.stage iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.stage.phone{display:grid;place-items:center;padding:18px;overflow:auto}
.stage.phone iframe{width:390px;max-width:100%;height:min(844px,100%);border-radius:28px;border:8px solid #000;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.4)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted);pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .app.viendo .side{display:none}
  .app:not(.viendo) .main{display:none}
  .bar .back{display:grid}
  .bar h2{order:-1;flex-basis:calc(100% - 52px)}
  .stage.phone{padding:0}.stage.phone iframe{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Gimnasios">
    <div class="brand"><small>Forge Studio</small><h1>Panel general</h1><p>Tus gimnasios. Elegí uno para entrar a su panel o ver su app.</p></div>
    <div class="lbl"><span>Gimnasios</span><span id="cnt"></span></div>
    <ul class="gyms" id="gyms"></ul>
    <div class="next"><span aria-hidden="true">＋</span><div>Cuando des de alta un gimnasio nuevo, aparece acá.</div></div>
    <div class="foot"><span>Solo vos ves esta página</span><button type="button" class="icon" id="tema" aria-label="Cambiar entre fondo claro y oscuro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
  </aside>
  <main class="main" id="main">
    <div class="empty"><p>Elegí un gimnasio de la lista.</p></div>
  </main>
</div>
<script>
/* Lista de gimnasios de la plataforma. Cada gym tiene su propia base de datos; acá solo están sus direcciones. */
const GYMS=[
  {id:'training-club',nombre:'Training Club',lugar:'Gimnasio · primer cliente',logo:'../logo-mark.png',panel:'../panel/',app:'../app/'}
];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guardar=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const leer=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let sel=leer('pg-gym'), vista=leer('pg-vista')==='app'?'app':'panel';
function lista(){
  $('#cnt').textContent=GYMS.length;
  $('#gyms').innerHTML=GYMS.map(g=>`<li><button type="button" class="gym" data-gym="${esc(g.id)}" aria-current="${g.id===sel}">
    <img src="${esc(g.logo)}" alt=""><span><b>${esc(g.nombre)}</b><small>${esc(g.lugar)}</small></span><i class="dot" aria-hidden="true" title="Activo"></i></button></li>`).join('');
}
function abrir(id,movil){
  const g=GYMS.find(x=>x.id===id); if(!g) return;
  sel=id; guardar('pg-gym',id); lista();
  const url=vista==='app'?g.app:g.panel;
  $('#main').innerHTML=`<div class="bar"><button type="button" class="icon back" id="volver" aria-label="Volver a la lista"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2>${esc(g.nombre)}</h2>
    <div class="seg" role="group" aria-label="Qué ver"><button type="button" data-vista="panel" aria-pressed="${vista==='panel'}">Panel del gym</button><button type="button" data-vista="app" aria-pressed="${vista==='app'}">App del socio</button></div>
    <a class="open" href="${esc(url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Abrir aparte</a></div>
    <div class="stage ${vista==='app'?'phone':''}"><iframe src="${esc(url)}" title="${vista==='app'?'App del socio':'Panel'} de ${esc(g.nombre)}" allow="clipboard-write; notifications; camera; microphone"></iframe>
    <div class="hint" id="hint">${vista==='app'?'Así ve la app un socio de '+esc(g.nombre):'Entrá con tu cuenta de profe de '+esc(g.nombre)}</div></div>`;
  setTimeout(()=>{const h=$('#hint'); if(h) h.style.opacity='0'},4000);
  if(movil) $('#app').classList.add('viendo');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-gym],[data-vista],#volver,#tema'); if(!b) return;
  if(b.dataset.gym) return abrir(b.dataset.gym,true);
  if(b.dataset.vista){ vista=b.dataset.vista; guardar('pg-vista',vista); return abrir(sel,true) }
  if(b.id==='volver') return $('#app').classList.remove('viendo');
  if(b.id==='tema'){ const r=document.documentElement, oscuro=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;
    r.dataset.theme=oscuro?'light':'dark'; guardar('pg-tema',r.dataset.theme) }
});
{const t=leer('pg-tema'); if(t==='light'||t==='dark') document.documentElement.dataset.theme=t}
lista();
if(sel&&GYMS.some(g=>g.id===sel)&&matchMedia('(min-width: 821px)').matches) abrir(sel,false);
else if(GYMS.length===1&&matchMedia('(min-width: 821px)').matches) abrir(GYMS[0].id,false);
</script>
</body>
</html>
